<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F7DF3" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="cs-sync" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Tile -->
  <rect width="512" height="512" rx="116" fill="url(#cs-bg)" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="6" />

  <!-- SYNC LOOP (Lower Center: 256, 310) -->
  <!-- Outer Concentric Arc -->
  <path d="M 152,246 A 124,124 0 1,0 360,246" 
        fill="none" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="16" 
        stroke-linecap="round" />

  <!-- Inner Dynamic Sync Arcs (Radius 78) -->
  <path d="M 180,310 A 78,78 0 0,1 324,260" 
        fill="none" 
        stroke="url(#cs-sync)" 
        stroke-width="18" 
        stroke-linecap="round" />
  <polygon points="340,248 334,286 304,262" fill="#FFFFFF" />

  <path d="M 332,310 A 78,78 0 0,1 188,360" 
        fill="none" 
        stroke="url(#cs-sync)" 
        stroke-width="18" 
        stroke-linecap="round" />
  <polygon points="172,372 178,334 208,358" fill="#FFFFFF" />

  <!-- GRADUATION CAP (Upper Center: 256, 195) -->
  <polygon points="256,132 414,195 256,258 98,195" 
           fill="rgba(30, 58, 138, 0.35)" />

  <polygon points="256,132 414,195 256,258 98,195" 
           fill="none" 
           stroke="#FFFFFF" 
           stroke-width="18" 
           stroke-linejoin="round" />

  <ellipse cx="256" cy="195" rx="8" ry="6" fill="#FFFFFF" />

  <!-- Tassel Cord -->
  <path d="M 414,195 Q 418,225 418,235" 
        fill="none" 
        stroke="#FDE047" 
        stroke-width="7" 
        stroke-linecap="round" />

  <!-- Tassel Fringe Droplet -->
  <path d="M 418,235 C 413,235 408,245 408,258 C 408,272 414,278 418,278 C 422,278 428,272 428,258 C 428,245 423,235 418,235 Z" 
        fill="#FDE047" />
</svg>
