version: "3.8"

services:
  test-db:
    image: postgres:16-alpine
    container_name: campussync-test-db
    restart: "no"
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_USER: campussync
      POSTGRES_PASSWORD: test_secure_pwd_2026
      POSTGRES_DB: campussync_test
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campussync -d campussync_test"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - campussync-test-net

  test-app:
    image: campussync-app:latest
    container_name: campussync-test-app
    restart: "no"
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      DATABASE_URL: postgres://campussync:test_secure_pwd_2026@test-db:5432/campussync_test
      JWT_SECRET: campussync-test-jwt-secret-key-2026
      COOKIE_SECRET: campussync-test-cookie-secret-key-32chars
      DEMO_MODE: "true"
      PORT: 3055
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3055:3055"
    depends_on:
      test-db:
        condition: service_healthy
    networks:
      - campussync-test-net

networks:
  campussync-test-net:
    driver: bridge
