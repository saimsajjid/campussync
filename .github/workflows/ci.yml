name: CampusSync CI & Container Release

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  test:
    name: Full CI Suite (PostgreSQL, Shared Validation, Unit & Test Plan Suites)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campussync
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: campussync
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Root Dependencies
        run: npm install

      - name: Run Sync Engine Pure Unit Tests
        run: npm test

      - name: Build & Test Shared Package (VA-11 Matrix Validation)
        run: |
          cd shared
          npm install
          npm run build
          npm test

      - name: Build Web Application
        run: |
          cd web
          npm install
          npm run build

      - name: Build Server Package & Run Migrations
        run: |
          cd server
          npm install
          npm run build
          DATABASE_URL=postgres://campussync:change-me@127.0.0.1:5432/campussync npm run db:migrate
          DATABASE_URL=postgres://campussync:change-me@127.0.0.1:5432/campussync npm run db:seed

      - name: Verify Expanded Seed, All 7 Integrity Invariants & Production JWT Guard
        run: |
          DATABASE_URL="postgres://campussync:change-me@127.0.0.1:5432/campussync" npx tsx scripts/verify-seed-and-integrity.ts

      - name: Run Append-Only Negative Mutation Test
        run: |
          DATABASE_URL="postgres://campussync:change-me@127.0.0.1:5432/campussync" npx tsx scripts/test-append-negative.ts

      - name: Start Server & Execute Full Test Plan Suite
        run: |
          cd server
          DATABASE_URL="postgres://campussync:change-me@127.0.0.1:5432/campussync" PORT=3055 DEMO_MODE=true JWT_SECRET=test-secret COOKIE_SECRET=test-cookie-secret-32-chars-long node dist/index.js > server.log 2>&1 &
          SERVER_PID=$!
          echo "Started CampusSync test server with PID: $SERVER_PID"
          
          echo "Waiting for server /health endpoint to respond..."
          HEALTHY=0
          for i in $(seq 1 30); do
            STATUS=$(curl -s http://127.0.0.1:3055/health || true)
            if echo "$STATUS" | grep -q "ok"; then
              echo "Server is healthy on attempt $i!"
              HEALTHY=1
              break
            fi
            sleep 1
          done

          if [ $HEALTHY -eq 0 ]; then
            echo "Server failed to become healthy. Server output log:"
            cat server.log
            exit 1
          fi

          cd ..
          echo "Running CampusSync Full Test Plan Suite against http://127.0.0.1:3055..."
          TEST_BASE_URL=http://127.0.0.1:3055 npx tsx scripts/test-plan-suite.ts || {
            echo "Test suite failed! Dumping server logs:"
            cat server/server.log
            exit 1
          }
          kill $SERVER_PID || true

      - name: Run Integrity Negative Suite (IC-4 to IC-10)
        run: |
          cd server
          DATABASE_URL="postgres://campussync:change-me@127.0.0.1:5432/campussync" PORT=3055 DEMO_MODE=true JWT_SECRET=test-secret COOKIE_SECRET=test-cookie-secret-32-chars-long node dist/index.js > server.log 2>&1 &
          SERVER_PID=$!
          echo "Started CampusSync test server with PID: $SERVER_PID"
          
          HEALTHY=0
          for i in $(seq 1 30); do
            STATUS=$(curl -s http://127.0.0.1:3055/health || true)
            if echo "$STATUS" | grep -q "ok"; then
              echo "Server is healthy on attempt $i!"
              HEALTHY=1
              break
            fi
            sleep 1
          done

          if [ $HEALTHY -eq 0 ]; then
            echo "Server failed to become healthy. Server output log:"
            cat server.log
            exit 1
          fi

          cd ..
          echo "Running CampusSync Integrity Negative Suite (IC-4 to IC-10)..."
          TEST_BASE_URL=http://127.0.0.1:3055 DATABASE_URL="postgres://campussync:change-me@127.0.0.1:5432/campussync" npx tsx scripts/integrity-negative-suite.ts || {
            echo "Integrity negative suite failed! Dumping server logs:"
            cat server/server.log
            exit 1
          }

          echo "Resetting database to clean seeded state and verifying integrity..."
          DATABASE_URL="postgres://campussync:change-me@127.0.0.1:5432/campussync" npx tsx scripts/verify-seed-and-integrity.ts
          kill $SERVER_PID || true

  build-arm64-ghcr:
    name: Build & Push ARM64 Image to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags (latest only on main)
        id: meta
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/${{ github.repository }}:${{ github.sha }}"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "ghcr.io/${{ github.repository }}:latest"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Build and Push ARM64 Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
