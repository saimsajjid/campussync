services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campussync
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: campussync
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campussync -d campussync"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://campussync:change-me@db:5432/campussync
      JWT_SECRET: change-me-to-a-long-random-string
      COOKIE_SECRET: change-me-cookie-secret-key-32chars
      DEMO_MODE: "true"
      PORT: 3050
      HOST: 0.0.0.0
    ports:
      - "${CAMPUSSYNC_PORT:-3050}:3050"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
