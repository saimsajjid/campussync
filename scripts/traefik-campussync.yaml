http:
  routers:
    campussync-https:
      entryPoints:
        - https
      service: campussync-svc
      rule: "Host(`150.136.103.208.sslip.io`) || Host(`campussync.duckdns.org`)"
      tls:
        certResolver: letsencrypt
      priority: 1000
    campussync-http:
      entryPoints:
        - http
      service: campussync-svc
      rule: "Host(`150.136.103.208.sslip.io`) || Host(`campussync.duckdns.org`) || Host(`150.136.103.208`)"
      priority: 1000
  services:
    campussync-svc:
      loadBalancer:
        servers:
          - url: "http://campussync-app:3050"
